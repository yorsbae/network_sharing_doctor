[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-sharing-doctor"
version = "0.1.0"
description = "Diagnosis printer & folder sharing Windows (Fase 1: baca-saja)"
requires-python = ">=3.10"
dependencies = []          # inti hanya memakai stdlib

[project.optional-dependencies]
gui = ["PySide6>=6.6,<7"]
build = ["pyinstaller"]

[project.scripts]
nsd = "nsd.main:main"

[tool.setuptools.packages.find]
where = ["src"]
